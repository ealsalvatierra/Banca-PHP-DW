name: Prohibir archivos Markdown
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  no-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rechazar cualquier archivo .md versionado
        run: |
          git ls-files -z | python3 -c 'import sys; files=sys.stdin.buffer.read().split(b"\0"); bad=[p for p in files if p.lower().endswith(b".md")]; print("Archivos Markdown:", len(bad)); [print(repr(p)) for p in bad]; sys.exit(bool(bad))'
